<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" type="text/css" href="styles.css" />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main>
      <article class="blog-card">
        <img src="assets/images/illustration-article.svg" />
        <header class="blog-card-content">
          <p><span>Learning</span></p>
          <p>Published <time datetime="2023-12-21">21 Dec 2023</time></p>
          <h3>HTML & CSS foundations</h3>
          <p>
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </header>
        <footer class="blog-card-footer">
          <img src="assets/images/image-avatar.webp" />
          <h3>Greg Hooper</h3>
        </footer>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/estebanrodriguez28">Esteban Rodriguez</a>.
    </footer>
  </body>
</html>
